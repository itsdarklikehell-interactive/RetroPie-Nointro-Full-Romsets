name: Gource visualization

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
      - ".github/workflows/gource.yml"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  workflow_dispatch:

concurrency:
  group: gource-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render Gource video
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_title: "${{ github.event.repository.name }} | Development History"
          gource_resolution: 1080p
          gource_fps: 60
          gource_filename_time: 3
          gource_hide_items: "mouse,date,filenames"
          gource_file_filter: '(^|/)gource\.mp4$|(__pycache__|\.pyc|node_modules|\.git/)'
          gource_auto_skip_seconds: 0.1
          gource_seconds_per_day: 0.4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq ffmpeg

      - name: Encode MP4 with 95 MiB size guard
        shell: bash
        run: |
          set -euo pipefail
          LIMIT=$((95 * 1024 * 1024))
          ffmpeg -y -i ./gource/gource.mp4 -c:v libx264 -crf 20 -preset medium -tune film -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart ./gource.mp4
          size=$(stat -c%s ./gource.mp4)
          if [ "$size" -gt "$LIMIT" ]; then
            ffmpeg -y -i ./gource/gource.mp4 -c:v libx264 -crf 26 -preset medium -tune film -vf "scale=-1:720" -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart ./gource-720p.mp4
            mv ./gource-720p.mp4 ./gource.mp4
            size=$(stat -c%s ./gource.mp4)
          fi
          if [ "$size" -gt "$LIMIT" ]; then
            echo "::error::Generated video remains above 95 MiB after 720p fallback."
            exit 1
          fi

      - name: Upload Gource video artifact
        uses: actions/upload-artifact@v4
        with:
          name: gource-visualization
          path: ./gource.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish root-level gource.mp4
        id: publish
        if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource.mp4
          if git diff --cached --quiet; then
            echo "Gource video is already up to date."
          else
            git commit -m "chore: publish updated Gource video"
            if git push; then
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Direct push was rejected; submitting the video through a pull request."
              git reset --soft HEAD~1
              echo "needs_pr=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open or update publication PR
        if: steps.publish.outputs.needs_pr == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/gource-video-update
          delete-branch: true
          add-paths: gource.mp4
          title: "chore: publish updated Gource video"
          commit-message: "chore: publish updated Gource video"
          body: |
            This PR publishes the latest generated root-level Gource video.
            The default branch rejected a direct push, so normal pull-request protections are retained.
