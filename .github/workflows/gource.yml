name: Gource visualization

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "gource.mp4"
  workflow_dispatch:

jobs:
  gource:
    uses: itsdarklikehell-interactive/ci-templates/.github/workflows/gource-reusable.yml@fa7ed5632eff0f4f33bed9bcb0a2eddd8ec5eea9
    permissions:
      contents: write
      actions: read
      pull-requests: write
